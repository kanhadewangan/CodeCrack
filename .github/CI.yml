name: CI

on:
  push:
    branches: [backend, frontend, main]
  pull_request:
    branches: [backend, frontend, main]

jobs:
  lint_and_types:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run type checks
        run: bun run check-types

  test:
    name: Test (Optional)
    runs-on: ubuntu-latest
    needs: lint_and_types
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: |
          if grep -R -q '"test"[[:space:]]*:' --include=package.json .; then
            bunx turbo run test
          else
            echo "No test scripts found. Skipping tests."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: apps/frontends/.next/
          if-no-files-found: error
          retention-days: 7
